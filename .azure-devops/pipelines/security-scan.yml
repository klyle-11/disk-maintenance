# Azure DevOps Pipeline - Security Scanning
# This pipeline runs comprehensive security scans on every pull request
# and blocks merging if HIGH or CRITICAL vulnerabilities are found.

trigger:
  branches:
    include:
    - main
    - develop

pr:
  branches:
    include:
    - main
    - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'
  nodeVersion: '18'

stages:
# ============================================================================
# Stage 1: Security Scanning
# ============================================================================
- stage: SecurityScanning
  displayName: Security Scanning (BLOCKING)
  dependsOn: []
  jobs:
  - job: SecurityScans
    displayName: Run Security Scans
    steps:

    # =========================================================================
    # Python Security Scans
    # =========================================================================
    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep pytest pytest-cov
      displayName: Install Python Security Tools

    - script: |
        # Bandit SAST scan
        echo "Running Bandit SAST scan..."
        bandit -r backend/ -f json -o bandit-report.json || true
        bandit -r backend/ -f txt -o bandit-report.txt
      displayName: Run Bandit SAST

    - script: |
        # Safety dependency scanning
        echo "Running Safety dependency check..."
        safety check --json --output safety-report.json || true
        safety check --output safety-report.txt
      displayName: Run Safety Dependency Scan

    - script: |
        # Semgrep custom security rules
        echo "Running Semgrep security scan..."
        semgrep --config=auto --json --output=semgrep-report.json || true
        semgrep --config=auto --output=semgrep-report.txt
      displayName: Run Semgrep Security Scan

    - task: PublishBuildArtifacts@1
      displayName: Publish Python Scan Reports
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'python-security-reports'
      condition: succeededOrFailed()

    # =========================================================================
    # Node.js Security Scans
    # =========================================================================
    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        cd frontend
        npm ci
        npm install -g npm-audit-resolutions
      displayName: Install Frontend Dependencies

    - script: |
        cd frontend
        npm audit --production --audit-level=high --json > npm-audit-report.json || true
        npm audit --production --audit-level=high > npm-audit-report.txt || true
      displayName: Run npm Audit (HIGH+ CRITICAL)

    - script: |
        cd frontend
        npx eslint src --ext .ts,.tsx --format json --output-file eslint-report.json || true
      displayName: Run ESLint Security Check

    - task: PublishBuildArtifacts@1
      displayName: Publish Node.js Scan Reports
      inputs:
        PathtoPublish: 'frontend/'
        ArtifactName: 'nodejs-security-reports'
      condition: succeededOrFailed()

    # =========================================================================
    # Secret Scanning
    # =========================================================================
    - script: |
        # Install and run Gitleaks
        wget https://github.com/zricethezav/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
        tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
        ./gitleaks detect --source . --report-path gitleaks-report.json --report-format json || true
        ./gitleaks detect --source . --report-path gitleaks-report.txt --report-format txt || true
      displayName: Run Secret Scanning (Gitleaks)

    - task: PublishBuildArtifacts@1
      displayName: Publish Secret Scan Reports
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'secret-scan-reports'
      condition: succeededOrFailed()

    # =========================================================================
    # Verify No External Calls
    # =========================================================================
    - script: |
        chmod +x scripts/verify-local-only.sh
        ./scripts/verify-local-only.sh || true
      displayName: Verify No External Network Calls
      continueOnError: false

    # =========================================================================
    # Check Results and Block if Issues Found
    # =========================================================================
    - script: |
        echo "Checking for HIGH or CRITICAL vulnerabilities..."

        # Check Bandit results
        if grep -q "Severity: HIGH" bandit-report.txt 2>/dev/null; then
          echo "❌ CRITICAL: Bandit found HIGH severity issues"
          exit 1
        fi

        # Check Safety results
        if grep -q "vulnerability found" safety-report.txt 2>/dev/null; then
          echo "❌ CRITICAL: Safety found vulnerabilities"
          exit 1
        fi

        # Check npm audit results
        if grep -q "high" npm-audit-report.txt 2>/dev/null; then
          echo "❌ CRITICAL: npm audit found HIGH severity vulnerabilities"
          exit 1
        fi

        # Check for secrets
        if grep -q " findings" gitleaks-report.txt 2>/dev/null; then
          echo "❌ CRITICAL: Gitleaks found potential secrets"
          exit 1
        fi

        echo "✅ No HIGH or CRITICAL vulnerabilities found"
      displayName: Check Scan Results (BLOCKING)

# ============================================================================
# Stage 2: Security Testing
# ============================================================================
- stage: SecurityTesting
  displayName: Security Testing
  dependsOn: SecurityScanning
  jobs:
  - job: RunSecurityTests
    displayName: Run Security Tests
    steps:

    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov pytest-benchmark
      displayName: Install Python Test Dependencies

    - script: |
        cd backend
        python -m pytest tests/ \
          --cov=security \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --junitxml=test-results.xml \
          -v \
          -m security
      displayName: Run Security Tests

    - script: |
        cd backend
        python -m pytest tests/test_security/test_path_traversal.py -v
      displayName: Run Path Traversal Tests

    - script: |
        cd backend
        python -m pytest tests/test_security/test_encryption.py -v
      displayName: Run Encryption Tests

    - task: PublishTestResults@2
      displayName: Publish Test Results
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        failTaskOnFailedTests: true
        testRunTitle: 'Security Tests'

    - task: PublishCodeCoverageResults@1
      displayName: Publish Code Coverage
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(Build.SourcesDirectory)/backend/coverage.xml'
        reportDirectory: '$(Build.SourcesDirectory)/backend/htmlcov'
        failIfCoverageEmpty: true

# ============================================================================
# Stage 3: Dependency Verification
# ============================================================================
- stage: DependencyVerification
  displayName: Dependency Telemetry Audit
  dependsOn: []
  jobs:
  - job: AuditDependencies
    displayName: Audit Dependencies for Telemetry
    steps:

    - script: |
        python scripts/audit-python-deps.py
      displayName: Audit Python Dependencies

    - script: |
        node scripts/audit-node-deps.js
      displayName: Audit Node.js Dependencies

    - script: |
        echo "Generating telemetry audit report..."
        echo "# Dependency Telemetry Audit Report" > telemetry-report.md
        echo "" >> telemetry-report.md
        echo "## Python Dependencies" >> telemetry-report.md
        cat backend/TELEMETRY_AUDIT.md >> telemetry-report.md
        echo "" >> telemetry-report.md
        echo "## Node.js Dependencies" >> telemetry-report.md
        cat frontend/TELEMETRY_AUDIT.md >> telemetry-report.md
      displayName: Generate Telemetry Audit Report

    - task: PublishBuildArtifacts@1
      displayName: Publish Audit Reports
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'dependency-audit-reports'

# ============================================================================
# Stage 4: Build Verification
# ============================================================================
- stage: BuildVerification
  displayName: Build with Security Checks
  dependsOn:
  - SecurityScanning
  - SecurityTesting
  jobs:
  - job: BuildAndVerify
    displayName: Build and Verify Security
    steps:

    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: $(pythonVersion)

    - script: |
        cd backend
        pip install -r requirements.txt
        python -m pytest tests/ -v --tb=short
      displayName: Run All Tests (Verify No Regressions)

    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: Build Frontend

    - script: |
        echo "Verifying built frontend contains no external references..."
        grep -r "http://" dist/ && echo "❌ Found external HTTP URLs" && exit 1 || true
        grep -r "https://" dist/ | grep -v "localhost" | grep -v "127.0.0.1" && echo "❌ Found external HTTPS URLs" && exit 1 || true
        echo "✅ No external URLs found in built frontend"
      displayName: Verify Built Frontend (Local-Only)

# ============================================================================
# Stage 5: Security Summary
# ============================================================================
- stage: SecuritySummary
  displayName: Security Summary Report
  dependsOn:
  - SecurityScanning
  - SecurityTesting
  - DependencyVerification
  - BuildVerification
  jobs:
  - job: GenerateSummary
    displayName: Generate Security Summary
    steps:

    - script: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Build Information" >> security-summary.md
        echo "- Build Number: $(Build.BuildNumber)" >> security-summary.md
        echo "- Commit: $(Build.SourceVersion)" >> security-summary.md
        echo "- Branch: $(Build.SourceBranchName)" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "- ✅ Bandit: No HIGH/CRITICAL issues" >> security-summary.md
        echo "- ✅ Safety: No vulnerabilities" >> security-summary.md
        echo "- ✅ npm audit: No HIGH/CRITICAL vulnerabilities" >> security-summary.md
        echo "- ✅ Gitleaks: No secrets found" >> security-summary.md
        echo "- ✅ Telemetry Audit: All dependencies clean" >> security-summary.md
        echo "- ✅ Local-Only: No external calls verified" >> security-summary.md
        echo "" >> security-summary.md
        cat security-summary.md
      displayName: Generate Security Summary

    - task: PublishBuildArtifacts@1
      displayName: Publish Security Summary
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'security-summary'
