[package]
name = "disk-intelligence"
version = "1.0.0"
description = "Disk Intelligence - find what is eating your disk"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "disk_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disk-core = { path = "../../core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Same version as Tauri's, for the window's input shape (click-through).
gtk = "0.18"
# Loaded at run time (as tao does), to ask an X11 desktop whether it has a tray.
x11-dl = "2.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
