[package]
name = "disk-intelligence"
version = "1.0.0"
description = "Disk Intelligence - find what is eating your disk"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "disk_intelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disk-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
