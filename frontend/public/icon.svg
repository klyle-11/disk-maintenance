<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Disk Intelligence app icon: a #FFFFFC wrench on a #6414D9 square.
       Source for every generated size; regenerate with `npx tauri icon icons/icon.svg`. -->
  <defs>
    <mask id="wrench" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(-19 20) rotate(45 512 512)">
        <!-- head, handle -->
        <circle cx="512" cy="318" r="178" fill="#fff"/>
        <rect x="448" y="330" width="128" height="548" rx="64" fill="#fff"/>
        <!-- open jaw, hanging hole -->
        <rect x="458" y="100" width="108" height="210" rx="16" fill="#000"/>
        <circle cx="512" cy="808" r="30" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="#6414D9"/>
  <rect width="1024" height="1024" fill="#FFFFFC" mask="url(#wrench)"/>
</svg>
