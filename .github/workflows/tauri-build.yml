# Build the Tauri app on macOS, Windows and Linux, run the core's tests, and
# check that the built app launches and stays up.
name: Tauri build

on:
  push:
    branches:
      - main
      - claude/desktop-ui-window-layout-oo4opk
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Electron build's devDependency isn't needed here; skip its download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev xvfb imagemagick

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund

      - name: Core tests
        run: cargo test -p diskcore

      - name: Build the app and its installers
        run: npm --prefix frontend run dist:tauri

      - name: List bundles
        shell: bash
        run: find target/release/bundle -maxdepth 2 | sort

      # Launch: start the built app, wait, check it's still running, screenshot.
      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        env:
          DISK_INTELLIGENCE_DB: ${{ runner.temp }}/smoke.db
        run: |
          mkdir -p smoke
          APP="target/release/bundle/macos/Disk Intelligence.app"
          "$APP/Contents/MacOS/disk-intelligence" > smoke/app.log 2>&1 &
          PID=$!
          sleep 25
          screencapture -x smoke/macos.png || true
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app exited during the launch check"; cat smoke/app.log; exit 1
          fi
          kill "$PID"; cat smoke/app.log; echo "The app stayed up for 25 s"

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DISK_INTELLIGENCE_DB: ${{ runner.temp }}\smoke.db
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $p = Start-Process -FilePath "target\release\disk-intelligence.exe" -PassThru `
            -RedirectStandardOutput smoke\app.out.log -RedirectStandardError smoke\app.err.log
          Start-Sleep -Seconds 25
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke\windows.png")
          } catch { Write-Host "Screenshot failed: $_" }
          if ($p.HasExited) {
            Write-Host "::error::The app exited during the launch check (code $($p.ExitCode))"
            Get-Content smoke\app.*.log; exit 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content smoke\app.*.log; Write-Host "The app stayed up for 25 s"

      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        env:
          DISK_INTELLIGENCE_DB: ${{ runner.temp }}/smoke.db
        run: |
          mkdir -p smoke
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          export DISPLAY=:99
          target/release/disk-intelligence > smoke/app.log 2>&1 &
          PID=$!
          sleep 25
          import -window root smoke/linux.png || true
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app exited during the launch check"; cat smoke/app.log; exit 1
          fi
          kill "$PID"; cat smoke/app.log; echo "The app stayed up for 25 s"

      - name: Upload launch screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-${{ runner.os }}
          path: smoke/
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
