# Tests the app and builds its installers on Windows, macOS and Linux.
# Each run keeps the installers as artifacts (Actions → the run → Artifacts),
# so they never have to be built on a machine short of disk space.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: di and frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: di runner tests
        run: |
          pip install -r backend/requirements.txt pytest httpx
          python -m pytest -q backend/tests/test_di_runner.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            # The oldest supported Ubuntu, so the .deb and AppImage run on more systems.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The di tests run real `python -m diskcli` commands.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            frontend/src-tauri
      - name: Core tests
        run: cargo test --manifest-path core/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app
        working-directory: frontend
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: disk-intelligence-${{ matrix.name }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
