# Tests the app, builds its installers on Windows, macOS and Linux, and checks
# that the built app launches and stays up.
# Each run keeps the installers as artifacts (Actions → the run → Artifacts),
# so they never have to be built on a machine short of disk space.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: di and frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: di runner tests
        run: |
          pip install -r backend/requirements.txt pytest httpx
          python -m pytest -q backend/tests/test_di_runner.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            # The oldest supported Ubuntu, so the .deb and AppImage run on more systems.
            os: ubuntu-22.04
          - name: linux-arm64
            # Raspberry Pi OS 64-bit (Pi 3, 4, 5, Zero 2 W) and other arm64 Linux.
            # Ubuntu 22.04's glibc is older than Pi OS Bookworm's, so it runs there.
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The di tests run real `python -m diskcli` commands.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            frontend/src-tauri
      - name: Core tests
        run: cargo test --manifest-path core/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app
        working-directory: frontend
        run: |
          npm install
          npm run dist
      # Launch check: start the built app, wait, fail if it has exited, and keep
      # a screenshot and its output (Artifacts → launch-<platform>).
      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p launch
          "frontend/src-tauri/target/release/bundle/macos/Disk Intelligence.app/Contents/MacOS/disk-intelligence" > launch/app.log 2>&1 &
          PID=$!
          sleep 25
          screencapture -x launch/macos.png || true
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app exited during the launch check"; cat launch/app.log; exit 1
          fi
          kill "$PID"; cat launch/app.log; echo "The app stayed up for 25 s"
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launch | Out-Null
          $p = Start-Process -FilePath "frontend\src-tauri\target\release\disk-intelligence.exe" -PassThru `
            -RedirectStandardOutput launch\app.out.log -RedirectStandardError launch\app.err.log
          Start-Sleep -Seconds 25
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("launch\windows.png")
          } catch { Write-Host "Screenshot failed: $_" }
          if ($p.HasExited) {
            Write-Host "::error::The app exited during the launch check (code $($p.ExitCode))"
            Get-Content launch\app.*.log; exit 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content launch\app.*.log; Write-Host "The app stayed up for 25 s"
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick
          mkdir -p launch
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          export DISPLAY=:99
          frontend/src-tauri/target/release/disk-intelligence > launch/app.log 2>&1 &
          PID=$!
          sleep 25
          import -window root launch/linux.png || true
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The app exited during the launch check"; cat launch/app.log; exit 1
          fi
          kill "$PID"; cat launch/app.log; echo "The app stayed up for 25 s"
      # The close button and tray as on macOS/Windows: with no tray, closing
      # quits; with a StatusNotifierItem tray (as on Raspberry Pi OS), the app
      # stays in the tray and its menu works (Artifacts → launch-<platform>).
      - name: Tray check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openbox wmctrl xdotool dbus-x11 python3-dbus python3-gi
          scripts/ci/linux-tray-check.sh frontend/src-tauri/target/release/disk-intelligence launch/tray
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.name }}
          path: launch/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: disk-intelligence-${{ matrix.name }}
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
